[project]
name = "tccqml"
version = "1.0.0"
description = "TCC - Quantum Machine Learning"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "pennylane>=0.45",
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "seaborn>=0.13",
]

# Extras opcionais: `pip install -e ".[dev]"` para desenvolver, `[notebooks]` para os .ipynb.
[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.5"]
# pymupdf: o notebook rasteriza os PDFs de `figuras` para exibi-los.
notebooks = ["jupyterlab>=4.2", "ipykernel>=6.29", "ipywidgets>=8.1", "pymupdf>=1.24"]

[project.scripts]
tccqml = "tccqml.cli:main"

[build-system]
# >= 77: primeira versão que aceita `license` como expressão SPDX e `license-files`.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 100
